services:
  - type: web
    name: agentnegotiate
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r backend/domain/requirements.txt && npm ci --prefix frontend && VITE_PAYPAL_CLIENT_ID="$PAYPAL_CLIENT_ID" VITE_DEFAULT_MODE=api npm run build --prefix frontend
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentnegotiate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: dots-studio/dots-3-note-preview:free
      - key: OPENROUTER_TIMEOUT_MS
        value: '30000'
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: '4096'
      # Enable B4 on the web service when ready for the integrated acceptance run.
      - key: B4_ENABLED
        value: 'false'
      # Explicit simulated demo policy, in USD cents including delivery.
      - key: MERCHANT_MINIMUM_TOTAL_CENTS
        value: '30000'
      # Enable for the coordinated migration deployment; domain runs before payments.
      - key: B2_RUN_MIGRATIONS
        value: 'false'
      - key: B2_HARNESS_ENABLED
        value: 'false'
      - key: B3_CAPTURE_ENABLED
        value: 'false'
      - key: B3_ALLOW_FAULT_INJECTION
        value: 'false'
      - key: B5_CAPTURE_ENABLED
        value: 'false'
      - key: B5_ALLOW_FAULT_INJECTION
        value: 'false'

databases:
  - name: agentnegotiate-db
    plan: free
    databaseName: agentnegotiate
    user: agentnegotiate
