services:
  - type: web
    name: agentnegotiate
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r backend/domain/requirements.txt && npm ci --prefix frontend && VITE_PAYPAL_CLIENT_ID="$PAYPAL_CLIENT_ID" VITE_DEFAULT_MODE=api npm run build --prefix frontend
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentnegotiate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: agentnegotiate-db
    plan: free
    databaseName: agentnegotiate
    user: agentnegotiate
